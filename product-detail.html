<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto | PolyStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen">
    <!-- ESQUINA SUPERIOR IZQUIERDA: Identidad y Navegación -->
    <div class="fixed top-8 left-8 z-50 flex items-center gap-6">
        <a href="index.html" class="text-xl font-bold tracking-tighter hover:text-gray-400 transition">
            POLY<span class="text-blue-500">STORE</span>
        </a>
        <a href="archived.html"
            class="text-[10px] bg-white/5 border border-white/10 px-4 py-2 rounded-full hover:bg-white/10 transition uppercase tracking-widest font-bold text-slate-400 hover:text-white">
            Catálogo →
        </a>
    </div>

    <!-- ESQUINA SUPERIOR DERECHA: Login / User -->
    <div class="fixed top-8 right-8 z-50 flex items-center gap-6 font-medium">
        <div id="auth-section">
            <button onclick="openLoginModal()"
                class="text-xs bg-white text-black px-5 py-2 rounded-full font-bold hover:bg-blue-500 hover:text-white transition-all">
                LOGIN
            </button>
        </div>
    </div>
    
    <!-- MODAL DE LOGIN (Capa superior) -->
    <div id="login-modal"
        class="fixed inset-0 bg-[#0f172a]/90 backdrop-blur-md z-[100] hidden flex items-center justify-center p-4">
        <div class="glass p-10 rounded-3xl max-w-sm w-full border border-white/10 shadow-2xl">
            <h2 class="text-3xl font-black mb-8 tracking-tighter text-white">ENTRAR</h2>
            <form id="login-form" class="space-y-4">
                <input type="email" id="login-email" placeholder="Email"
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500 transition-all text-sm text-white">
                <input type="password" id="login-password" placeholder="Contraseña"
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500 transition-all text-sm text-white">
                <button type="submit"
                    class="w-full bg-blue-600 py-4 rounded-2xl font-bold text-white hover:bg-blue-500 transition-all shadow-lg shadow-blue-600/20">
                    ACCEDER
                </button>
                <button type="button" onclick="closeLoginModal()"
                    class="w-full text-xs text-slate-500 hover:text-white transition-all pt-2">
                    CANCELAR
                </button>
            </form>
        </div>
    </div>

    <!-- TARJETA DE PRODUCTO LIVE -->
    <div id="product-card" class="glass p-8 rounded-3xl shadow-2xl max-w-md w-full hidden">
        <div class="relative">
            <span class="absolute -top-4 -left-4 bg-green-500 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-widest">
                Live Now
            </span>
            <img id="p-image" src="" alt="Producto" class="w-full h-64 object-cover rounded-2xl mb-6 shadow-lg">
        </div>

        <h1 id="p-name" class="text-3xl font-black mb-2 tracking-tight">Cargando...</h1>
        <p id="p-description" class="text-slate-400 mb-6 text-sm leading-relaxed"></p>

        <div class="flex items-center justify-between">
            <span id="p-price" class="text-3xl font-mono font-bold text-green-400"></span>
            <button id="button" class="bg-white text-black px-6 py-2 rounded-xl font-bold hover:bg-green-400 transition-colors">
                Comprar
            </button>
        </div>
    </div>

    <div id="loader" class="text-slate-500 font-mono">Conectando con PolyStore API...</div>

    <!-- Scripts en orden: Primero la lógica de sesión, luego la carga de datos -->
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
