<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inktruders - Live Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen">
    <!-- Login -->
    <div class="fixed top-8 right-8 z-50 flex items-center gap-6 font-medium">
        <a href="archived.html"
            class="text-sm text-slate-400 hover:text-white transition-all uppercase tracking-widest">
            Catálogo
        </a>

        <div id="auth-section">
            <!-- JS inyectará aquí el botón de Login o el nombre de usuario -->
            <button onclick="openLoginModal()"
                class="text-xs bg-white text-black px-5 py-2 rounded-full font-bold hover:bg-blue-500 hover:text-white transition-all">
                LOGIN
            </button>
        </div>
    </div>
    <!-- Modal -->
    <div id="login-modal"
        class="fixed inset-0 bg-[#0f172a]/90 backdrop-blur-md z-[100] hidden flex items-center justify-center p-4">
        <div class="glass p-10 rounded-3xl max-w-sm w-full border border-white/10 shadow-2xl">
            <h2 class="text-3xl font-black mb-8 tracking-tighter">ENTRAR</h2>
            <form id="login-form" class="space-y-4">
                <input type="email" id="login-email" placeholder="Email"
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500 transition-all text-sm">
                <input type="password" id="login-password" placeholder="Contraseña"
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500 transition-all text-sm">
                <button type="submit"
                    class="w-full bg-blue-600 py-4 rounded-2xl font-bold text-white hover:bg-blue-500 transition-all shadow-lg shadow-blue-600/20">
                    ACCEDER
                </button>
                <button type="button" onclick="closeLoginModal()"
                    class="w-full text-xs text-slate-500 hover:text-white transition-all pt-2">
                    CANCELAR
                </button>
            </form>
        </div>
    </div>
    <div id="product-card" class="glass p-8 rounded-3xl shadow-2xl max-w-md w-full hidden">
        <div class="relative">
            <span class="absolute -top-4 -left-4 bg-green-500 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-widest">Live Now</span>
            <a id="p-image-link" href="#">
                <img id="p-image" src="" alt="Producto" class="w-full h-64 object-cover rounded-2xl mb-6 shadow-lg hover:opacity-90 transition-opacity">
            </a>
        </div>

        <h1 id="p-name" class="text-3xl font-black mb-2 tracking-tight">Cargando...</h1>
        <p id="p-description" class="text-slate-400 mb-6 text-sm leading-relaxed"></p>

        <div class="flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <span id="p-price" class="text-3xl font-mono font-bold text-green-400"></span>
                <button id="button" class="bg-white text-black px-6 py-2 rounded-xl font-bold hover:bg-green-400 transition-colors">
                    Comprar
                </button>
            </div>
            
            <a id="p-details-btn" href="#" class="w-full text-center py-2.5 rounded-xl text-xs font-bold tracking-widest uppercase bg-white/5 border border-white/10 text-slate-300 hover:bg-white/10 hover:text-white transition-all">
                Ver Detalles del Diseño
            </a>
        </div>
    </div>

    <div id="loader" class="text-slate-500 font-mono">Conectando con PolyStore API...</div>

    <!-- Ref script auth -->
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
