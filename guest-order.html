<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Pedido | PolyStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="p-6 lg:p-12 flex items-center justify-center min-h-screen">

    <div id="loader" class="text-slate-500 font-mono tracking-widest text-xs uppercase animate-pulse">
        Consultando la base de datos...
    </div>

    <div id="order-card" class="glass p-8 lg:p-12 rounded-[2.5rem] max-w-3xl w-full hidden space-y-8">
        
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-white/5 pb-6">
            <div>
                <span class="text-[10px] font-mono tracking-widest text-blue-400 uppercase font-black">Resumen de Compra</span>
                <h1 id="order-id" class="text-2xl font-black tracking-tight uppercase font-mono mt-1">PEDIDO #----</h1>
            </div>
            <div id="order-status"></div>
        </div>

        <div class="space-y-4">
            <h3 class="text-[10px] tracking-[0.2em] font-bold text-slate-500 uppercase">Artículos del Pedido</h3>
            <div id="order-items" class="divide-y divide-white/5 space-y-3">
                </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 pt-6 border-t border-white/5 text-xs font-mono">
            <div class="space-y-1 text-slate-400">
                <span class="text-[9px] tracking-wider text-slate-500 font-sans font-bold uppercase block mb-1">Datos del Cliente</span>
                <p id="shipping-name" class="text-white font-sans font-bold"></p>
                <p id="shipping-date" class="text-[10px]"></p>
            </div>
            <div class="flex flex-col justify-end items-start sm:items-end space-y-2">
                <div class="text-slate-400">Total Pagado: <span id="order-total" class="text-2xl font-black text-blue-400 ml-2 font-mono">0.00€</span></div>
            </div>
        </div>

        <div class="text-center pt-4">
            <a href="index.html" class="inline-block text-[10px] tracking-widest uppercase font-bold bg-white/5 border border-white/10 px-6 py-3 rounded-full text-slate-400 hover:text-white hover:bg-white/10 transition">
                Volver al Inicio
            </a>
        </div>
    </div>

    <script src="js/guest-order.js"></script>
</body>
</html>
