<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Carrito | PolyStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: white;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <div class="fixed top-8 left-8 z-50 flex items-center gap-6">
        <a href="index.html" class="text-xl font-bold tracking-tighter hover:text-gray-400 transition">
            POLY<span class="text-blue-500">STORE</span>
        </a>
        <a href="archived.html" class="text-[10px] bg-white/5 border border-white/10 px-4 py-2 rounded-full hover:bg-white/10 transition uppercase tracking-widest font-bold text-slate-400 hover:text-white">
            ← Seguir Comprando
        </a>
    </div>

    <main class="container mx-auto px-4 pt-32 pb-12 flex-grow max-w-5xl">
        <header class="mb-12">
            <h1 class="text-4xl font-black uppercase tracking-tight">Tu Carrito</h1>
            <p class="text-slate-400 text-sm">Gestiona los artículos seleccionados antes de confirmar tu pedido.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <div id="cart-items-container" class="lg:col-span-8 space-y-4">
                </div>

            <div class="lg:col-span-4 glass p-8 rounded-3xl space-y-6 sticky top-32">
                <h2 class="text-xl font-bold tracking-tight">Resumen</h2>
                
                <div class="space-y-3 text-sm text-slate-400 border-b border-white/10 pb-4">
                    <div class="flex justify-between">
                        <span>Subtotal</span>
                        <span id="cart-subtotal" class="text-white font-mono">0.00€</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Gastos de envío</span>
                        <span class="text-green-400 font-bold uppercase tracking-wider text-[11px] bg-green-500/10 px-2 py-0.5 rounded-md">Gratis</span>
                    </div>
                </div>

                <div class="flex justify-between items-center">
                    <span class="text-base font-bold">Total</span>
                    <span id="cart-total" class="text-3xl font-mono font-black text-blue-400">0.00€</span>
                </div>

                <button id="checkout-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-2xl font-bold text-base shadow-xl shadow-blue-600/10 hover:scale-[1.02] transition-all flex items-center justify-center gap-3">
                    <i class="fa-solid fa-lock text-xs opacity-60"></i>
                    PROCESAR PAGO
                </button>
            </div>

        </div>
    </main>

    <footer class="py-6 border-t border-white/5 text-center text-[10px] text-slate-600 uppercase tracking-widest font-mono">
        PolyStore Checkout System LocalStorage V1
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/cart-helper.js"></script>
    <script src="js/cart-view.js"></script> </body>
</html>
