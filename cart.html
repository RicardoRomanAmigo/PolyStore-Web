<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Carrito | PolyStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen">

    <header class="flex justify-between items-center py-6 px-8 border-b border-white/10">
        <div class="flex items-center gap-6">
            <a href="index.html" class="text-xl font-bold tracking-tighter">POLY<span class="text-blue-500">STORE</span></a>
            <a href="archived.html" class="text-[10px] bg-white/5 border border-white/10 px-4 py-2 rounded-full hover:bg-white/10 transition uppercase tracking-widest font-bold text-slate-400">
                ← Seguir Comprando
            </a>
        </div>
        <div id="auth-section" class="text-sm font-bold"></div>
    </header>

    <div id="login-modal" class="fixed inset-0 bg-[#0f172a]/90 backdrop-blur-md z-[100] hidden flex items-center justify-center p-4">
        <div class="glass p-10 rounded-3xl max-w-sm w-full border border-white/10 shadow-2xl">
            <h2 class="text-3xl font-black mb-8 tracking-tighter">ENTRAR</h2>
            <form id="login-form" class="space-y-4">
                <input type="email" id="login-email" placeholder="Email" class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500 transition-all text-sm">
                <input type="password" id="login-password" placeholder="Contraseña" class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500 transition-all text-sm">
                <button type="submit" class="w-full bg-blue-600 py-4 rounded-2xl font-bold text-white hover:bg-blue-500 transition-all">ACCEDER</button>
                <button type="button" onclick="closeLoginModal()" class="w-full text-xs text-slate-500 hover:text-white transition-all pt-2">CANCELAR</button>
            </form>
        </div>
    </div>

    <main class="container mx-auto px-4 pt-12 pb-12 max-w-5xl">
        <header class="mb-12">
            <h1 class="text-4xl font-black uppercase tracking-tight">Tu Carrito</h1>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <div id="cart-items-container" class="lg:col-span-8 space-y-4"></div>

            <div class="lg:col-span-4 glass p-8 rounded-3xl space-y-6 sticky top-8">
                <h2 class="text-xl font-bold tracking-tight">Resumen</h2>
                <div class="space-y-3 text-sm text-slate-400 border-b border-white/10 pb-4">
                    <div class="flex justify-between">
                        <span>Subtotal</span>
                        <span id="cart-subtotal" class="text-white font-mono">0.00€</span>
                    </div>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-base font-bold">Total</span>
                    <span id="cart-total" class="text-3xl font-mono font-black text-blue-400">0.00€</span>
                </div>
                <button id="checkout-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-2xl font-bold transition-all flex items-center justify-center gap-3">
                    <i class="fa-solid fa-lock text-xs"></i> PROCESAR PAGO
                </button>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/cart-helper.js"></script>
    <script src="js/cart-view.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateAuthUI();
            const loginForm = document.getElementById('login-form');
            if (loginForm) loginForm.addEventListener('submit', handleLogin);
        });
    </script>
</body>
</html>
