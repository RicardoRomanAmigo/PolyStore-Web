<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo de Productos | PolyStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            background-color: #0f172a;
            /* Azul muy oscuro de fondo fijo */
            color: white;
        }

        .product-grid-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .product-grid-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body class="min-h-screen">
    <!-- ESQUINA SUPERIOR IZQUIERDA: Título y Volver -->
    <div class="fixed top-8 left-8 z-50 flex items-center gap-6">
        <a href="index.html" class="text-xl font-bold tracking-tighter hover:text-gray-400 transition">
            POLY<span class="text-blue-500">STORE</span>
        </a>
        <a href="index.html"
            class="text-[10px] bg-white/5 border border-white/10 px-4 py-2 rounded-full hover:bg-white/10 transition uppercase tracking-widest font-bold">
            ← Live Product
        </a>
    </div>

    <!-- ESQUINA SUPERIOR DERECHA: Login / User -->
    <div class="fixed top-8 right-8 z-50 flex items-center gap-5 font-medium">

        <a href="cart.html"
            class="relative bg-white/5 border border-white/10 p-3 rounded-full hover:bg-white/10 transition-all flex items-center justify-center group">
            <i class="fa-solid fa-cart-shopping text-slate-300 group-hover:text-white transition-colors"></i>
            <span id="cart-count"
                class="absolute -top-1 -right-1 bg-blue-500 text-white text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center hidden">
                0
            </span>
        </a>

        <div id="auth-section">
            <button onclick="openLoginModal()"
                class="text-xs bg-white text-black px-5 py-2 rounded-full font-bold hover:bg-blue-500 hover:text-white transition-all">
                LOGIN
            </button>
        </div>
    </div>

    <!-- MODAL DE LOGIN (Se mantiene igual) -->
    <div id="login-modal"
        class="fixed inset-0 bg-[#0f172a]/90 backdrop-blur-md z-[100] hidden flex items-center justify-center p-4">
        <div class="glass p-10 rounded-3xl max-w-sm w-full border border-white/10 shadow-2xl">
            <h2 class="text-3xl font-black mb-8 tracking-tighter">ENTRAR</h2>
            <form id="login-form" class="space-y-4">
                <input type="email" id="login-email" placeholder="Email"
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500 transition-all text-sm text-white">
                <input type="password" id="login-password" placeholder="Contraseña"
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500 transition-all text-sm text-white">
                <button type="submit"
                    class="w-full bg-blue-600 py-4 rounded-2xl font-bold text-white hover:bg-blue-500 transition-all shadow-lg shadow-blue-600/20">
                    ACCEDER
                </button>
                <button type="button" onclick="closeLoginModal()"
                    class="w-full text-xs text-slate-500 hover:text-white transition-all pt-2">
                    CANCELAR
                </button>
            </form>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container mx-auto px-4 pt-32 pb-12"> <!-- Aumentado pt-32 para que el header no tape el título -->
        <header class="text-center mb-16">
            <h1 class="text-5xl font-black mb-4 uppercase">Catálogo</h1>
            <p class="text-gray-400 max-w-2xl mx-auto">
                Colección exclusiva de productos pasados.
            </p>
        </header>

        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Loader... -->
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/cart-helper.js"></script>
    <script src="js/archived.js"></script>
</body>

</html>
